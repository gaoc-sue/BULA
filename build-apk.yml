name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o projeto Android
        run: npm run android:prepare

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk remedio-falado.apk

      - name: Guardar o APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: remedio-falado-apk
          path: remedio-falado.apk

      - name: Publicar o APK para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk remedio-falado.apk \
            --title "Remédio Falado (APK de teste)" \
            --notes "Versão gerada automaticamente a partir do commit ${GITHUB_SHA::7}. Para instalar, permita apps de fontes desconhecidas no Android."
